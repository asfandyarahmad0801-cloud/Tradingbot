# 1m scalping profile: fixed $10 margin x 10 leverage, $100 account.
# PAPER mode on OKX live public market data (Binance live API is geo-blocked
# from the research environment). Hard stops: $2 max loss per trade,
# halt after $15 total loss, 10% daily loss, max 3 open positions.
# Learning: setups/contexts cool down after 3 straight losses and are banned
# once 15+ trades show a negative average (state/setup_memory.json).
mode: paper
exchange:
  id: okx
  sandbox: false
  quote_currencies:
  - USDT
  - USDC
  rate_limit_ms: 50
universe:
  refresh_interval_seconds: 60
  quote_currencies:
  - USDT
  - USDC
  min_quote_volume_24h_usd: 20000000
  min_orderbook_depth_usd_within_10bps: 50000
  max_spread_bps: 8
  min_contract_age_days: 3
  max_price_staleness_seconds: 10
  exclude_coin_margined: true
  max_symbols_scanned_concurrently: 8
timeframes:
  entry:
  - 1m
  confirmation:
  - 5m
  higher_context:
  - 1h
scalping_horizons:
  ultra_short:
    max_holding_seconds: 60
  short_term:
    max_holding_seconds: 300
  intraday_scalp:
    max_holding_seconds: 900
  extended_scalp:
    enabled: false
    max_holding_seconds: 14400
risk:
  risk_per_trade_pct: 0.25
  max_daily_loss_pct: 10.0
  max_weekly_loss_pct: 15.0
  max_portfolio_exposure_pct: 300.0
  max_effective_account_leverage: 3.0
  max_position_leverage: 10.0
  max_concurrent_positions: 3
  max_positions_per_coin: 1
  max_correlated_cluster_exposure_pct: 300.0
  max_consecutive_losses: 4
  max_trades_per_hour: 12
  max_trades_per_coin_per_day: 10
  min_liquidation_distance_multiple_of_stop: 3.0
  max_slippage_bps: 15
  max_spread_bps: 8
  cooldown_seconds_after_loss: 300
  cooldown_seconds_after_exit: 60
  sizing_mode: fixed_margin
  fixed_margin_usd: 10.0
  fixed_leverage: 10.0
  max_loss_per_trade_usd: 2.0
  max_total_loss_usd: 15.0
expectancy:
  min_expected_value_bps: 5.0
  min_reward_to_risk: 1.3
  min_win_probability: 0.35
execution:
  default_order_type: limit_post_only
  max_market_order_slippage_bps: 10
  order_timeout_seconds: 5
  max_order_split_notional_usd: 20000
  paper_starting_balance: 100.0
macro:
  blackout_minutes_before_event: 15
  blackout_minutes_after_event: 15
  leverage_multiplier_during_event_window: 0.5
pump_dump:
  pump_score_block_threshold: 85
  dump_score_block_threshold: 85
database:
  url: sqlite:///./state/scalp_paper.db
logging:
  level: INFO
  json: false
learning:
  enabled: true
  memory_path: state/setup_memory.json
  loss_streak_for_cooldown: 3
  cooldown_minutes: 1440
  min_trades_to_judge: 15
  ban_t_threshold: -1.0
  judge_window: 50
