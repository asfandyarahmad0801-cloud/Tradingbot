[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tradingbot"
version = "0.1.0"
description = "Leveraged crypto perpetual-futures scalping research and execution framework"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "Proprietary" }
dependencies = [
    "ccxt>=4.3.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "SQLAlchemy>=2.0.0",
    "PyYAML>=6.0.1",
    "python-dotenv>=1.0.1",
    "structlog>=24.1.0",
    "websockets>=12.0",
    "aiohttp>=3.9.0",
    "streamlit>=1.32.0",
    "plotly>=5.20.0",
    "scikit-learn>=1.4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0", "pytest-cov>=5.0.0", "mypy>=1.9.0", "ruff>=0.4.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
