# Default configuration for the scalping system.
# This file holds NON-SECRET settings only. API keys/secrets come from
# environment variables (see .env.example) and are never written here.
#
# Defaults are intentionally conservative: paper mode, low leverage, small
# risk per trade, tight portfolio limits. Widening these is a deliberate,
# explicit operator decision -- never a code default.

mode: paper   # backtest | paper | live

exchange:
  id: binanceusdm          # ccxt exchange id for USDT-margined perpetuals
  sandbox: true             # use exchange testnet/sandbox endpoints when true
  quote_currencies: ["USDT", "USDC"]
  rate_limit_ms: 50

universe:
  refresh_interval_seconds: 300
  quote_currencies: ["USDT", "USDC"]
  min_quote_volume_24h_usd: 5_000_000
  min_orderbook_depth_usd_within_10bps: 50_000
  max_spread_bps: 8
  min_contract_age_days: 3
  max_price_staleness_seconds: 10
  exclude_coin_margined: true
  max_symbols_scanned_concurrently: 60

timeframes:
  entry: ["1m", "3m"]
  confirmation: ["5m", "15m"]
  higher_context: ["1h"]

scalping_horizons:
  ultra_short:
    max_holding_seconds: 60
  short_term:
    max_holding_seconds: 300
  intraday_scalp:
    max_holding_seconds: 900
  extended_scalp:
    enabled: false
    max_holding_seconds: 14400

risk:
  risk_per_trade_pct: 0.25          # % of equity risked per trade (at stop)
  max_daily_loss_pct: 2.0
  max_weekly_loss_pct: 5.0
  max_portfolio_exposure_pct: 30.0   # sum of notional / equity
  max_effective_account_leverage: 3.0
  max_position_leverage: 5.0
  max_concurrent_positions: 4
  max_positions_per_coin: 1
  max_correlated_cluster_exposure_pct: 12.0
  max_consecutive_losses: 4
  max_trades_per_hour: 6
  max_trades_per_coin_per_day: 3
  min_liquidation_distance_multiple_of_stop: 3.0
  max_slippage_bps: 15
  max_spread_bps: 8
  cooldown_seconds_after_loss: 300
  cooldown_seconds_after_exit: 60

expectancy:
  min_expected_value_bps: 5.0        # minimum EV per trade after all costs, in bps of notional
  min_reward_to_risk: 1.3
  min_win_probability: 0.35

execution:
  default_order_type: "limit_post_only"
  max_market_order_slippage_bps: 10
  order_timeout_seconds: 5
  max_order_split_notional_usd: 20_000

macro:
  blackout_minutes_before_event: 15
  blackout_minutes_after_event: 15
  leverage_multiplier_during_event_window: 0.5

pump_dump:
  pump_score_block_threshold: 85
  dump_score_block_threshold: 85

database:
  url: "sqlite:///./tradingbot.db"

logging:
  level: "INFO"
  json: true
